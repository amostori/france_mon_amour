 {% extends "base.html" %}
 {% block title %}Français, mon amour{% endblock %}
 {% block name %}{{user.username}}{% endblock %}
 {% block content %}
 
 <!-- Form -->
<section>
    <div class="container">
        <form method="post" action="#">
            {% csrf_token %}
            <div class="row gtr-uniform">
                <div class="col-6 col-12-xsmall">
                    <input type="text" name="body" id="demo-name" placeholder="Saisissez une expression" />
                </div>
                <div class="col-12">
                    <ul class="actions">
                        <li><input class="button primary fit" type="submit" value="Sauvegarder" /></li>
                    </ul>
                </div>
            </div>
        </form>
    </div>
</section>
<section>
<!-- Table -->
    <div class="container">
        <div class="table-wrapper">
            <table class="alt">
                <tbody>
                    {% for post in posts %}
                    <tr>
                        <td>{{ post.body }}</td>
                        <td><a href="{% url 'edit_post' post.id %}">Edit</a></td>
                        <td><a href="{% url 'delete_post' post.id %}">Delete</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>  
    </div>
</section>
 {% endblock %}
